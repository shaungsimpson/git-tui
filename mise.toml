[tasks.build]
description = "Build bin/git-tui"
run = "go build -o bin/git-tui ./cmd/git-tui"

[tasks.lint]
description = "golangci-lint with the repository's .golangci.yml (includes gofmt and vet)"
tools.golangci-lint = "2.15.0" # only this task needs it; same version as CI
run = "golangci-lint run"

[tasks.test]
description = "gofmt check, go vet, tests with the race detector"
run = [
  "test -z \"$(gofmt -l .)\" || { gofmt -l .; echo 'run gofmt -w . on the files above'; exit 1; }",
  "go vet ./...",
  "go test -race ./...",
]

[tasks.start]
description = "Build and run; extra arguments go to git-tui"
depends = ["build"]
run = "./bin/git-tui"

[tasks.demo]
description = "Build and run with fixture data"
depends = ["build"]
run = "./bin/git-tui -demo"

[tasks.install-cli]
description = "Install the git-tui command into Go's install directory (go env GOBIN, or GOPATH/bin)"
run = "go install ./cmd/git-tui"

[tasks.update]
description = "Pull main and install the git-tui command from it"
run = [
  "test \"$(git branch --show-current)\" = main || { echo 'update runs on main: git checkout main first'; exit 1; }",
  "git pull --ff-only",
  "go install ./cmd/git-tui",
]

[tasks.screenshots]
description = "Capture README screenshots of the demo in Ghostty (macOS; needs Screen Recording and Accessibility)"
run = "scripts/screenshots.sh"
